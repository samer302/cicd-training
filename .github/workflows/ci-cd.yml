name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::323756936493:role/github-actions-deploy-cicd-training
          aws-region: us-east-1

      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-059858a3bee5384f8" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy from GitHub Actions" \
            --parameters 'commands=[
              "cd /home/ubuntu/cicd-training",
              "git pull origin main",
              "docker build -t cicd-training .",
              "docker rm -f myapp || true",
              "docker run -d -p 80:3000 --name myapp cicd-training",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command sent. ID: $COMMAND_ID"
          echo "Waiting for command to complete..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-059858a3bee5384f8" || true

          echo "===== Command Output ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-059858a3bee5384f8" \
            --query "StandardOutputContent" \
            --output text

          echo "===== Command Errors (if any) ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-059858a3bee5384f8" \
            --query "StandardErrorContent" \
            --output text

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-059858a3bee5384f8" \
            --query "Status" \
            --output text)

          echo "Final status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed!"
            exit 1
          fi